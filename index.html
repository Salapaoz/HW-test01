<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Homework</title>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="icon">📚</span> My Homework
  </div>
  <div class="top-actions">
    <button id="subjectBtn" class="sub-btn">📂 วิชา</button>
    <button id="addBtn" class="add-btn">✨ เพิ่ม</button>
  </div>
</header>

<section class="summary">
  <div class="sum-card pending">
    <div class="sum-icon">⏳</div>
    <div>
      <h3>งานที่ค้าง</h3>
      <span id="pendingBox">0</span>
    </div>
  </div>
  <div class="sum-card soon">
    <div class="sum-icon">🔥</div>
    <div>
      <h3>ใกล้ส่ง</h3>
      <span id="soonBox">0</span>
    </div>
  </div>
</section>

<nav id="filterBar" class="filter-scroll"></nav>

<main id="list" class="task-list"></main>

<div id="subModal" class="modal hidden">
  <div class="modal-card small-card">
    <h2>📂 หมวดหมู่วิชา</h2>
    <div class="add-subject-row">
      <input type="text" id="newSubjectInput" placeholder="ชื่อวิชาใหม่...">
      <button id="addNewSubjectBtn">＋</button>
    </div>
    <ul id="subjectList" class="subject-list"></ul>
    <button class="cancel full-width" id="closeSubBtn">ปิดหน้าต่าง</button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modalTitle">✏️ รายละเอียดงาน</h2>

    <label>🏷️ ชื่องาน *</label>
    <input type="text" id="title" placeholder="เช่น การบ้านบทที่ 1">

    <label>⏰ วันที่ส่ง *</label>
    <input type="date" id="due">

    <label>📘 รายวิชา</label>
    <select id="subject">
      <option value="">-- เลือกวิชา --</option>
    </select>

    <label>📝 รายละเอียด</label>
    <textarea id="detail" class="detail-box" placeholder="โน้ตเพิ่มเติม..."></textarea>

    <div class="actions">
      <button class="done" id="toggleDoneBtn">✔ เสร็จแล้ว</button>
      <button class="delete">🗑 ลบ</button>
      <button class="save">💾 บันทึก</button>
      <button class="cancel">ยกเลิก</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
